name: Acceptance

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  acceptance:
    name: Emulator Integration, Rules, and Browser Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      NEXT_PUBLIC_USE_FIREBASE_EMULATOR: "true"
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ascs11
      FIREBASE_PROJECT_ID: ascs11
      NEXT_PUBLIC_FIREBASE_API_KEY: fake-api-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ascs11.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ascs11.appspot.com
      SESSION_COOKIE_NAME: ascs_session
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java (Firestore emulator dependency)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build Next.js application
        run: npm run build

      - name: Run emulator integration and Firestore Rules tests
        run: npx firebase emulators:exec --only auth,firestore "npm run test:integration"

      - name: Run Playwright browser acceptance tests
        run: npx firebase emulators:exec --only auth,firestore "npx playwright test"

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
